<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ламинат - ПолиАрт</title>
    <link rel="stylesheet" href="css/HeaderAndFooter.css">
    <link rel="stylesheet" href="css/product.css">
    <style>
        /* Модальное окно заказа */
        #orderModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100000;
            justify-content: center;
            align-items: center;
        }
        .order-modal-content {
            background: white;
            border-radius: 20px;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }
        .order-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .order-modal-header h3 { margin: 0; font-size: 22px; color: #2c3e50; }
        .order-modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; }
        .order-product { display: flex; gap: 20px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .order-product img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; }
        .order-product-info h4 { margin: 0 0 8px 0; font-size: 18px; }
        .order-product-price { font-size: 20px; font-weight: bold; color: #e74c3c; margin: 10px 0; }
        .quantity-control { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        .quantity-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: white; font-size: 20px; cursor: pointer; }
        .quantity-input { width: 60px; text-align: center; font-size: 18px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; }
        .delivery-section { margin-bottom: 25px; }
        .delivery-section h4 { margin-bottom: 12px; color: #2c3e50; }
        .delivery-option { margin-bottom: 10px; }
        .delivery-option label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .address-block { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 12px; display: none; }
        .address-block textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; margin: 10px 0; }
        .services-section { margin-bottom: 25px; }
        .services-section h4 { margin-bottom: 12px; color: #2c3e50; }
        .service-option { margin-bottom: 8px; }
        .order-total { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px; border-radius: 16px; margin: 20px 0; }
        .order-total-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .order-total-final { font-size: 22px; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; margin-top: 12px; }
        .modal-actions { display: flex; gap: 15px; justify-content: flex-end; }
        .btn-cancel { padding: 12px 24px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer; }
        .btn-submit { padding: 12px 24px; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; border-radius: 10px; cursor: pointer; }
        .btn-constructor { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin-left: 10px; }
        .product-main__inner { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
        .gallery-main { text-align: center; }
        .gallery-main__image { max-width: 100%; max-height: 400px; object-fit: contain; }
        .product-price { font-size: 28px; font-weight: bold; color: #e74c3c; margin: 15px 0; }
        .price-unit { font-size: 16px; font-weight: normal; color: #666; }
        .product-actions { display: flex; gap: 15px; margin: 20px 0; }
        .btn--primary { background: #e74c3c; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .tabs-nav { display: flex; gap: 20px; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; }
        .tab-btn.active { border-bottom: 2px solid #e74c3c; color: #e74c3c; }
        .tab-pane { display: none; padding: 20px 0; }
        .tab-pane.active { display: block; }
        .laminate-specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .laminate-spec-item { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #eabb66; }
        .loading-container { text-align: center; padding: 50px; }
        .error { color: red; text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <header class="header"></header>

    <main class="product-page">
        <div class="container">
            <div class="product-main__inner" id="productContainer">
                <div class="loading-container">Загрузка товара...</div>
            </div>
        </div>

        <div class="container" style="margin-top: 40px;">
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="description">Описание</button>
                <button class="tab-btn" data-tab="specifications">Характеристики</button>
                <button class="tab-btn" data-tab="reviews">Отзывы</button>
                <button class="tab-btn" data-tab="delivery">Доставка</button>
            </div>
            
            <div id="description" class="tab-pane active"></div>
            <div id="specifications" class="tab-pane">
                <div class="laminate-specs-grid"></div>
            </div>
            <div id="reviews" class="tab-pane">
                <div class="reviews-list"></div>
            </div>
            <div id="delivery" class="tab-pane">
                <h3>Доставка ламината</h3>
                <p>Бесплатная доставка по Великому Новгороду при заказе от 25 000 ₽</p>
                <p>Самовывоз: ежедневно с 9:00 до 18:00</p>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <!-- Модальное окно заказа -->
    <div id="orderModal">
        <div class="order-modal-content">
            <div class="order-modal-header">
                <h3>🛒 Оформление заказа</h3>
                <button class="order-modal-close" id="closeModalBtn">&times;</button>
            </div>
            
            <div class="order-product">
                <img id="modalProductImage" src="" alt="">
                <div class="order-product-info">
                    <h4 id="modalProductName"></h4>
                    <div class="order-product-price" id="modalProductPrice"></div>
                    <div class="quantity-control">
                        <button class="quantity-btn" id="qtyMinus">-</button>
                        <input type="number" id="orderQty" class="quantity-input" value="1" min="1" max="99">
                        <button class="quantity-btn" id="qtyPlus">+</button>
                    </div>
                </div>
            </div>
            
            <div class="delivery-section">
                <h4>🚚 Способ получения</h4>
                <div class="delivery-option">
                    <label><input type="radio" name="deliveryType" value="pickup" checked> 📦 Самовывоз (бесплатно)</label>
                </div>
                <div class="delivery-option">
                    <label><input type="radio" name="deliveryType" value="delivery"> 🚚 Доставка (500 ₽)</label>
                </div>
                <div class="delivery-option">
                    <label><input type="radio" name="deliveryType" value="installation"> 🔧 Доставка + установка (1500 ₽)</label>
                </div>
                
                <div id="addressBlock" class="address-block">
                    <label>📍 Адрес доставки</label>
                    <textarea id="deliveryAddress" rows="2" placeholder="Введите адрес доставки..."></textarea>
                    <label><input type="checkbox" id="saveAddressChk"> 💾 Сохранить адрес в профиле</label>
                </div>
            </div>
            
            <div class="services-section">
                <h4>➕ Дополнительные услуги</h4>
                <div class="service-option">
                    <label><input type="checkbox" id="serviceWarranty"> 🛡️ Расширенная гарантия (+500 ₽)</label>
                </div>
                <div class="service-option">
                    <label><input type="checkbox" id="serviceAssembly"> 🛠️ Дополнительный монтаж (+1000 ₽)</label>
                </div>
            </div>
            
            <div class="order-total">
                <div class="order-total-row"><span>Товар:</span><span id="totalProduct">0 ₽</span></div>
                <div class="order-total-row"><span>Доставка:</span><span id="totalDelivery">0 ₽</span></div>
                <div class="order-total-row"><span>Услуги:</span><span id="totalServices">0 ₽</span></div>
                <div class="order-total-final"><span>Итого:</span><span id="totalAmount">0 ₽</span></div>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelModalBtn">Отмена</button>
                <button class="btn-submit" id="submitOrderBtn">Добавить в корзину</button>
            </div>
        </div>
    </div>

    <script src="js/header.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth-state.js"></script>
    <script src="js/laminate-product.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
